<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>范晨星的个人空间 - Welcome</title>
    <style>
        /* --- 2006年 Web 2.0 风格 CSS --- */
        body {
            /* 经典的平铺背景纹理或渐变 */
            background-color: #e0e5ec;
            background-image: linear-gradient(to bottom, #dbe3eb 0%, #ffffff 100%);
            font-family: "Verdana", "宋体", sans-serif; /* 那个年代最常用的字体 */
            font-size: 12px;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 760px; /* 那个年代标准的 800x600 分辨率适配宽度 */
            background-color: #fff;
            border: 1px solid #8faec9;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2); /* 很重的阴影 */
            text-align: left;
        }

        /* 顶部标题栏：经典的高光渐变 */
        .header {
            background: linear-gradient(to bottom, #6da6d6 0%, #3d84b8 50%, #2e6a9e 51%, #3582c4 100%);
            padding: 15px 20px;
            border-bottom: 1px solid #1f5a8c;
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-family: "Georgia", "Times New Roman", serif; /* 标题常用衬线体 */
            text-shadow: 1px 1px 2px #000;
        }

        .header .subtitle {
            font-size: 11px;
            color: #cce4f7;
            margin-top: 5px;
        }

        .content {
            padding: 20px;
            display: flex; /* 模拟当年的两栏布局 */
            gap: 20px;
        }

        /* 左侧栏 */
        .sidebar {
            width: 180px;
            text-align: center;
            border-right: 1px dashed #ccc;
            padding-right: 20px;
        }

        /* 右侧主内容 */
        .main-area {
            flex: 1;
        }

        /* 头像：加上边框和阴影 */
        .avatar-box {
            width: 100px;
            height: 100px;
            margin: 0 auto 10px;
            border: 3px solid #fff;
            outline: 1px solid #ccc;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #666;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 16px;
            color: #cc0000; /* 醒目的红色标题 */
            border-bottom: 1px dotted #999;
            padding-bottom: 5px;
            margin-top: 0;
        }

        .bio-text {
            line-height: 1.8;
            color: #444;
            background-color: #fcfcfc;
            border: 1px solid #eee;
            padding: 10px;
        }

        /* 2006 风格的水晶按钮 */
        .btn-group {
            margin-top: 20px;
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }

        .retro-btn {
            background: linear-gradient(to bottom, #f0f9ff 0%, #cbebff 47%, #a1dbff 100%);
            border: 1px solid #7aaad6;
            border-radius: 3px; /* 小圆角 */
            padding: 6px 20px;
            color: #004a80;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            display: inline-block;
        }

        .retro-btn:hover {
            background: linear-gradient(to bottom, #a1dbff 0%, #cbebff 47%, #f0f9ff 100%);
        }

        footer {
            background-color: #f0f0f0;
            border-top: 1px solid #ccc;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #666;
        }

        /* 简单的跑马灯效果（可选） */
        marquee {
            background-color: #ffffe0;
            border: 1px solid #e6db55;
            padding: 2px;
            color: #555;
            font-size: 11px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部横幅 -->
        <div class="header">
            <h1>Welcome to Fan's World</h1>
            <div class="subtitle">My Personal Homepage | Since 2006</div>
        </div>

        <!-- 主体内容 -->
        <div class="content">
            <!-- 左侧个人信息栏 -->
            <div class="sidebar">
                <div class="avatar-box">范</div>
                <p><strong>Name:</strong> 范晨星</p>
                <p><strong>Age:</strong> 16</p>
                <p><strong>Status:</strong> Online 🟢</p>
                <hr style="border: 0; border-top: 1px dashed #ccc;">
                <p style="font-size: 11px; color: #888;">他们在看着你</p>
            </div>

            <!-- 右侧主要区域 -->
            <div class="main-area">
                <!-- 那个年代流行的滚动字幕 -->
                <marquee scrollamount="4">欢迎来到我的个人主页！这里记录了我的生活点滴和学习感悟... Please sign my guestbook!</marquee>

                <h2>About Me</h2>
                <div class="bio-text">
                    <p id="typewriter-text"></p> <!-- 打字机效果将在这里显示 -->
                </div>

                <div class="btn-group">
                    <button class="retro-btn" onclick="showSecret()">输入密码进入</button>
                    <button class="retro-btn" onclick="alert('留言板正在建设中...')">给我留言</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- JS 交互部分 ---

        // 打字机效果
        const textToType = "你好，我是范晨星。";
        const typeWriterElement = document.getElementById('typewriter-text');
        let i = 0;

        function typeWriter() {
            if (i < textToType.length) {
                typeWriterElement.innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, 100);
            }
        }

        window.onload = typeWriter;

        // 密码验证逻辑
        function showSecret() {
            const password = prompt('请输入访问密码 (Password):');
            if (password === null) {
                return;
            }
            if (password.trim() === '2006') {
                alert('Access Granted! 🎉\n欢迎回到过去！');
                // 可以在这里添加跳转代码，例如 window.location.href = 'secret.html';
            } else {
                alert('Access Denied! ❌\n密码错误，请重试。');
            }
        }
    </script>

</body>
</html>
