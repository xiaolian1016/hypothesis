<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>范晨星的主页</title>
    <style>
        /* --- CSS 样式部分：极简且充满活力 --- */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --accent-color: #3498db; /* 充满活力的蓝色 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* 头像区域 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: #fff;
            box-shadow: 0 8px 16px rgba(161, 140, 209, 0.3);
            border: 4px solid #fff;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 15px;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .bio {
            line-height: 1.7;
            color: #555;
            margin-bottom: 30px;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        /* 按钮区域 */
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            outline: none;
        }

        .btn-primary {
            background-color: var(--text-main);
            color: #fff;
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.3);
        }

        .btn-primary:hover {
            background-color: #000;
            transform: translateY(-2px);
        }

        .btn-outline {
            border: 2px solid #e0e0e0;
            color: var(--text-main);
            background: transparent;
        }

        .btn-outline:hover {
            border-color: var(--text-main);
            background: #fff;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头像 -->
        <div class="avatar">
            范
        </div>

        <!-- 名字与身份 -->
        <h1 id="name-display">你好，我是 范晨星</h1>
        <p class="subtitle">🎓 16岁 / 高中生 / 探索者</p>

        <!-- 自我介绍 -->
        <div class="bio">
            <p>欢迎来到假想空间</p>
        </div>

        <!-- 按钮 -->
        <div class="actions">
            <button class="btn btn-primary" onclick="showSecret()">输入密码</button>
        </div>
        
        <footer>
            © 2024 Fan Chenxing. All rights reserved.
        </footer>
    </div>

    <script>
        // --- JS 交互部分 ---

        // 简单的打字机效果
        const nameElement = document.getElementById('name-display');
        const originalText = nameElement.innerText;
        nameElement.innerText = '';
        
        let i = 0;
        function typeWriter() {
            if (i < originalText.length) {
                nameElement.innerHTML += originalText.charAt(i);
                i++;
                setTimeout(typeWriter, 100); 
            }
        }
        
        window.onload = typeWriter;
        function showSecret() {
            const password = prompt('请输入密码：');
            if (password === null) {
                return; // 用户取消了输入
            }
            if (password.trim() === '2006') {
                alert('欢迎');
            } else {alert('想想你是谁');
        }
    }
    </script>

</body>
</html>
