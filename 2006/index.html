<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        /* --- CSS 样式部分 --- */
        :root {
            --bg-color: #f9f9f9;
            --text-main: #333333;
            --text-sub: #666666;
            --accent-color: #2c3e50; /* 深蓝色点缀 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* 头像区域 */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #e0e0e0;
            margin: 0 auto 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #fff;
            background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%); /* 如果没有图片，用渐变色代替 */
        }
        
        /* 如果你有图片，取消下面注释并替换src */
        /* .avatar img { width: 100%; height: 100%; object-fit: cover; } */

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* 简介文本 */
        .bio {
            line-height: 1.8;
            color: #444;
            margin-bottom: 30px;
            text-align: left;
        }

        /* 技能标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .tag {
            background: #f0f2f5;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-sub);
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: var(--accent-color);
            color: #fff;
            transform: translateY(-2px);
        }

        /* 按钮区域 */
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #1a252f;
        }

        .btn-outline {
            border-color: #ddd;
            color: var(--text-main);
            background: transparent;
        }

        .btn-outline:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- 头像 -->
        <div class="avatar">
            <!-- 这里可以用 <img src="你的照片.jpg"> 替换 -->
            范
        </div>

        <!-- 名字与职位 -->
        <h1 id="name-display">你好，我是 范晨星</h1>
        <p class="subtitle">前端开发者 / 极简主义爱好者 / 终身学习者</p>

        <!-- 自我介绍 -->
        <div class="bio">
            <p>你好！欢迎来到我的个人空间。</p>
            <p>我热衷于创造简洁、高效的数字体验。平时喜欢研究 Web 技术，偶尔也会写写博客记录生活。我相信代码不仅是逻辑的堆砌，更是一种表达自我的艺术。</p>
        </div>

        <!-- 技能标签 -->
        <div class="tags">
            <span class="tag">HTML/CSS</span>
            <span class="tag">JavaScript</span>
            <span class="tag">UI Design</span>
            <span class="tag">Photography</span>
            <span class="tag">Coffee</span>
        </div>

        <!-- 按钮 -->
        <div class="actions">
            <a href="#" class="btn btn-primary" onclick="sayHello()">联系我</a>
            <a href="#" class="btn btn-outline" onclick="toggleBio()">了解更多</a>
        </div>
    </div>

    <script>
        // --- JS 交互部分 ---

        // 简单的打字机效果（可选）
        const nameElement = document.getElementById('name-display');
        const originalText = nameElement.innerText;
        nameElement.innerText = '';
        
        let i = 0;
        function typeWriter() {
            if (i < originalText.length) {
                nameElement.innerHTML += originalText.charAt(i);
                i++;
                setTimeout(typeWriter, 100); // 打字速度
            }
        }
        
        // 页面加载完成后启动打字效果
        window.onload = typeWriter;

        // 按钮交互函数
        function sayHello() {
            alert('谢谢你的访问！请发送邮件至：your-email@example.com');
        }

        function toggleBio() {
            alert('这里可以跳转到你的详细博客页面，或者展开更多内容。');
        }
    </script>

</body>
</html>
